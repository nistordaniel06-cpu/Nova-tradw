name: NOVA demo checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check engine.js
          node --check app.js
          node --check progression.js
          node --check community.js
      - name: Run simulation engine tests
        run: node --test tests.test.js
