name: NOVA demo checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check engine.js
          node --check app.js
          node --check progression.js
          node --check community.js
          node --check account.js
          node --check online-ui.js
          node --check config.js
          node --check market.js
          node --check wallet.js
          node --check exchange.js
          node --check real-crypto-ui.js
          node --check api/market.js
      - name: Run simulation engine tests
        run: node --test tests.test.js online.test.js market.test.js wallet.test.js exchange.test.js
